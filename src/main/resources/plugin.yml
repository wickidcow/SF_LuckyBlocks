name: SlimefunLuckyBlocks
version: ${project.version}
main: io.github.thebusybiscuit.slimefunluckyblocks.SlimefunLuckyBlocks
api-version: '1.21.11'
folia-supported: true

author: TheBusyBiscuit
contributors:
  - iiLuckyDev
  - wickidcow
website: https://github.com/wickidcow/SF_LuckyBlocks
description: Lucky Blocks for Slimefun Legacy on Minecraft 1.21.11 through 26.2 Paper/Purpur, with Folia 26.2 support.

depend:
  - Slimefun

commands:
  luckyrestore:
    description: Check or restore original LuckyBlocks equipment with legacy Chinese names
    usage: /luckyrestore <check|hand>
    permission: slimefunluckyblocks.restore
  luckygive:
    description: Give real Slimefun Lucky Blocks or Pandora's Box to an online player
    usage: /luckygive <player> <normal|lucky|unlucky|pandora> [amount]
    permission: slimefunluckyblocks.give
permissions:
  slimefunluckyblocks.restore:
    description: Restore legacy LuckyBlocks equipment names
    default: op
  slimefunluckyblocks.give:
    description: Give registered Lucky Blocks to online players
    default: op
