name: Build LuckyBlocks Legacy

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: luckyblocks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "1.0.4"
  OUTPUT_NAME: "SF_LuckyBlocks1.0.4.jar"

jobs:
  build:
    name: Universal LuckyBlocks compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LuckyBlocks
        uses: actions/checkout@v6
        with:
          path: luckyblocks
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: slimefun-legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: luckyblocks/pom.xml
      - name: Publish Slimefun Legacy API to Maven Local
        working-directory: slimefun-legacy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=Legacy-SNAPSHOT -x test --no-daemon
      - name: Verify compatibility metadata
        working-directory: luckyblocks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.4</version>' pom.xml
          grep -Fq '<server.api.version>1.21.11-R0.1-SNAPSHOT</server.api.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<finalName>SF_LuckyBlocks${project.version}</finalName>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
      - name: Verify Paper/Purpur 1.21.11 compilation
        working-directory: luckyblocks
        run: mvn -B -ntp clean package
      - name: Verify Paper/Purpur 26.2 compilation
        working-directory: luckyblocks
        run: mvn -B -ntp clean package '-Dserver.api.version=[26.2.build,26.3)'
      - name: Verify Paper 26.3 alpha compilation
        working-directory: luckyblocks
        run: mvn -B -ntp clean package -Dserver.api.version=26.3-rc-3.build.1-alpha
      - name: Verify Folia 26.2 compilation
        working-directory: luckyblocks
        run: mvn -B -ntp -Pfolia clean package
      - name: Build universal release JAR from 1.21.11 baseline
        working-directory: luckyblocks
        run: mvn -B -ntp clean package -Dserver.api.version=1.21.11-R0.1-SNAPSHOT
      - name: Stage and verify versioned JAR
        working-directory: luckyblocks
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="target/${OUTPUT_NAME}"
          test -s "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "dist/${OUTPUT_NAME}"
          unzip -p "dist/${OUTPUT_NAME}" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "dist/${OUTPUT_NAME}" io.github.thebusybiscuit.slimefunluckyblocks.SlimefunLuckyBlocks | grep -Fq 'major version: 65'
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: luckyblocks/dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        working-directory: luckyblocks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="LuckyBlocks 1.0.4 restores English names for historical Chinese-named Lucky armor and weapons via the opt-in /luckyrestore command; preserves Paper/Purpur 1.21.11, the stable Paper/Purpur 26.2 production lane, Folia 26.2 support, and Java 21 universal bytecode. Maven now emits ${OUTPUT_NAME} directly."
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$JAR" --clobber; else gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --notes "$NOTES" --title "SF_LuckyBlocks $TAG"; fi
