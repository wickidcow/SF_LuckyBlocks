name: Build LuckyBlocks Legacy

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: luckyblocks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25 / Paper-Purpur-Folia 26.2 / Slimefun Legacy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LuckyBlocks
        uses: actions/checkout@v5
        with:
          path: luckyblocks
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: slimefun-legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: luckyblocks/pom.xml
      - name: Publish Slimefun Legacy API to Maven Local
        working-directory: slimefun-legacy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=Legacy-SNAPSHOT -x test --no-daemon
      - name: Verify Folia 26.2 compilation
        working-directory: luckyblocks
        run: mvn -B -ntp -Pfolia clean package
      - name: Build Paper/Purpur 26.2 JAR
        working-directory: luckyblocks
        run: mvn -B -ntp clean package
      - name: Stage versioned JAR
        id: artifact
        working-directory: luckyblocks
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          SOURCE="target/SF_LuckyBlocks_Legacy_v${VERSION}.jar"
          JAR="SF_LuckyBlocks${VERSION}.jar"
          test -s "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "dist/${JAR}"
          sha256sum "dist/${JAR}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: luckyblocks/dist/${{ steps.artifact.outputs.jar }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: luckyblocks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          JAR: ${{ steps.artifact.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "dist/${JAR}" --clobber; else gh release create "$TAG" "dist/${JAR}" --target "$GITHUB_SHA" --generate-notes --title "SF_LuckyBlocks $TAG"; fi
