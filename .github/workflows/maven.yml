name: Build LuckyBlocks 26.2 / Slimefun Legacy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckyblocks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25 / Paper-Purpur-Folia 26.2 / Slimefun Legacy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LuckyBlocks
        uses: actions/checkout@v5
        with:
          path: luckyblocks

      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: slimefun-legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: luckyblocks/pom.xml

      - name: Publish Slimefun Legacy API to Maven Local
        working-directory: slimefun-legacy
        shell: bash
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            echo "Slimefun Legacy publish attempt ${attempt}/3"
            if ./gradlew publishToMavenLocal -PprojectVersion=Legacy-SNAPSHOT -x test --no-daemon; then
              exit 0
            fi
          done
          exit 1

      - name: Verify Folia 26.2 compilation
        working-directory: luckyblocks
        run: mvn -B -ntp -Pfolia clean package

      - name: Build Paper/Purpur 26.2 JAR
        working-directory: luckyblocks
        run: mvn -B -ntp clean package

      - name: Verify and stage direct JAR
        id: artifact
        working-directory: luckyblocks
        shell: bash
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAR="SF_LuckyBlocks_Legacy_v${VERSION}.jar"
          SOURCE="target/${JAR}"

          test -f "${SOURCE}"
          mkdir -p dist
          cp "${SOURCE}" "dist/${JAR}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "jar=${JAR}" >> "${GITHUB_OUTPUT}"
          sha256sum "dist/${JAR}"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: luckyblocks/dist/${{ steps.artifact.outputs.jar }}
          archive: false
          if-no-files-found: error

      - name: Create or update GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: luckyblocks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          JAR: ${{ steps.artifact.outputs.jar }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          TITLE="LuckyBlocks Legacy v${VERSION}"
          NOTES="Paper/Purpur/Folia 26.2 + Slimefun Legacy maintenance build. The attached .jar is ready to place directly in the server plugins folder."

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "dist/${JAR}" --clobber
          else
            gh release create "${TAG}" "dist/${JAR}" --title "${TITLE}" --notes "${NOTES}" --target "${GITHUB_SHA}"
          fi
