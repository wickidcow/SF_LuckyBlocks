name: Build LuckyBlocks Legacy

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Paper 26.2 / Slimefun Legacy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build raw JAR
        run: mvn -B -ntp clean package --file pom.xml

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/SF_LuckyBlocks_Legacy_v1.0.0.jar"
          test -f "$JAR"
          echo "Built: $JAR"
          ls -lh "$JAR"

      # GitHub Actions artifacts are downloaded as ZIP archives.
      # Publish the plugin as a GitHub Release asset instead so the user gets
      # the actual .jar file directly with no extraction step.
      - name: Publish raw JAR release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/SF_LuckyBlocks_Legacy_v1.0.0.jar"
          TAG="build-${GITHUB_RUN_NUMBER}"
          TITLE="SF LuckyBlocks Legacy Build #${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --prerelease \
            --notes "Automated Slimefun Legacy compatibility build for Paper/Purpur/Folia 26.2+. Download the raw SF_LuckyBlocks_Legacy_v1.0.0.jar asset directly."

          {
            echo "## 🍀 LuckyBlocks Legacy build complete"
            echo
            echo "Raw JAR: **SF_LuckyBlocks_Legacy_v1.0.0.jar**"
            echo
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
